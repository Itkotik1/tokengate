spring.application.name=tokengate

# Настройки H2 Database (встроенная БД)
spring.datasource.url=jdbc:h2:mem:tokengate_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Включаем веб-консоль H2 (чтобы смотреть таблицы в браузере)
spring.h2.console.enabled=true

# Настройки JPA / Hibernate
# update - автоматически создавать/обновлять таблицы при запуске
spring.jpa.hibernate.ddl-auto=update
# Показывать SQL-запросы в консоли (удобно для защиты)
spring.jpa.show-sql=true